version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: msiva
      POSTGRES_PASSWORD: mokshith@123
      POSTGRES_DB: touch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msiva -d touch"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app  # Syncs local backend code with the container
      - /app/node_modules  # Prevents overriding node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: always

  frontend:
    build: ./client
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app  # Syncs local frontend code with the container
      - /app/node_modules  # Prevents overriding node_modules
    depends_on:
      - backend
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: sivamudusu@gmail.com
      PGADMIN_DEFAULT_PASSWORD: mokshith@123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_fileserver
    ports:
      - "8080:80"
    volumes:
      - ./assets:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
